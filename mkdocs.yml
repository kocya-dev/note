site_name: test doc name
site_description: 'サイトの紹介'
site_url: 'https://kocya-dev.github.io/note/'

copyright: 'Copyright (c) 2023'

docs_dir: docs
theme:
  variant: classic
  language: ja
  features:
     # Anchor tracking
     - navigation.tracking
     # Instant load
     - navigation.instant
     # ページナビゲーションを折りたたみ可能なリンクで左側に配置します。
     - navigation.expand
     # トップへ戻るボタン
     - navigation.top
     # Code Annotate
     - content.code.annotate
     # Tab
     - tabs
     # Navigation Tabs
     - navigation.tabs
# Options
#extra:
#  palette:
#    primary: 'Light Blue'
#    accent: 'Orange'
#  font:
#    text: 'Roboto'
#    code: 'Roboto Mono'
    
markdown_extensions:
  # - plantuml_markdown:
  #    server: http://127.0.0.1:8080
  - admonition
  # 目次
  - toc:
        permalink: true # 自動生成を有効にする
        permalink_title: このセクションへのアンカーリンク
        toc_depth: 3 # 見出しの深さ
  - pymdownx.tabbed:
        alternate_style: true
  - mdx_truly_sane_lists:
      nested_indent: 2
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # コードハイライトの設定(インラインブロック版)
  - pymdownx.inlinehilite
  # コンテンツの折りたたみを有効化
  - pymdownx.details
  # 打ち消し線の追加
  - pymdownx.tilde
  # 注釈の追加
  - footnotes
  # 定義リスト
  - def_list
